<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="0.35" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="25" cy="44" rx="14" ry="2.5" fill="#000" opacity="0.25"/>
  <!-- spikes -->
  <g stroke="#111" stroke-linecap="round">
    <line x1="24" y1="3" x2="24" y2="45" stroke-width="4"/>
    <line x1="3" y1="24" x2="45" y2="24" stroke-width="4"/>
    <line x1="10" y1="10" x2="38" y2="38" stroke-width="3.5"/>
    <line x1="38" y1="10" x2="10" y2="38" stroke-width="3.5"/>
  </g>
  <!-- body -->
  <circle cx="24" cy="24" r="14" fill="url(#ball)" stroke="#000" stroke-width="1"/>
  <!-- highlight -->
  <ellipse cx="19" cy="18.5" rx="5" ry="4" fill="url(#shine)"/>
  <rect x="16.5" y="16" width="4" height="4" fill="#fff"/>
</svg>
